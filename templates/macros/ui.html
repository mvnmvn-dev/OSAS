{% macro csrf_field() %}
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{% endmacro %}

{% macro form_input(name, label, type='text', value='', placeholder='', required=false) %}
<div class="form-group">
    <label class="form-label" for="{{ name }}">{{ label }}</label>
    <input type="{{ type }}" id="{{ name }}" name="{{ name }}" value="{{ value }}" placeholder="{{ placeholder }}" class="form-control" {% if required %}required{% endif %}>
</div>
{% endmacro %}

{% macro form_textarea(name, label, value='') %}
<div class="form-group">
    <label class="form-label" for="{{ name }}">{{ label }}</label>
    <textarea id="{{ name }}" name="{{ name }}" rows="3" class="form-control">{{ value }}</textarea>
</div>
{% endmacro %}

{% macro form_select(name, label, options, selected='') %}
<div class="form-group">
    <label class="form-label" for="{{ name }}">{{ label }}</label>
    <select id="{{ name }}" name="{{ name }}" class="form-control">
        {% for val, text in options %}
        <option value="{{ val }}" {% if val == selected %}selected{% endif %}>{{ text }}</option>
        {% endfor %}
    </select>
</div>
{% endmacro %}
