services:
  - type: web
    name: osas-bcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/db_bootstrap.py && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SHOW_DEMO_CREDENTIALS
        value: "0"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: OTP_ENABLED
        value: "1"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "OSAS <onboarding@resend.dev>"
      - key: PGSSL
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_USERNAME
        value: software.engineer
      - key: SEED_PASSWORD
        value: Engineer@OSAS2026
      - key: SEED_EMAIL
        value: cursorman20@gmail.com
      - key: SEED_FULL_NAME
        value: Software Engineer
      - key: SEED_ROLE
        value: admin
      - key: UPLOAD_FOLDER
        value: static/uploads
      - key: EXPORT_FOLDER
        value: static/exports